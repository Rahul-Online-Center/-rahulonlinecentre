<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Control Panel - Rahul Online Centre</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-auth-box {
      max-width: 400px;
      margin: 40px auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    .admin-panel-box {
      display: none;
      max-width: 600px;
      margin: 20px auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    .form-field {
      margin-bottom: 16px;
    }
    .form-field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .form-field input, .form-field textarea, .form-field select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      font-family: inherit;
    }
    .form-field textarea {
      resize: vertical;
      min-height: 80px;
    }
    .btn-admin {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-logout {
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fca5a5;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .alert-msg {
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 14px;
      display: none;
    }
    .alert-success { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .alert-error { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="container nav-flex">
      <a href="index.html" class="brand">
        <div class="brand-icon"><i class="fa-solid fa-lock"></i></div>
        <div>
          <div class="brand-title">Rahul Online Centre</div>
          <div class="brand-sub">एडमिन कंट्रोल पैनल (Owner Only)</div>
        </div>
      </a>
      <a href="index.html" style="font-size: 12px; color: var(--primary); text-decoration: none; font-weight: 700;">
        <i class="fa-solid fa-arrow-left"></i> होमपेज
      </a>
    </div>
  </header>

  <main class="container">

    <!-- 1. Password Login Box -->
    <div class="admin-auth-box" id="authBox">
      <div style="text-align: center; margin-bottom: 18px;">
        <i class="fa-solid fa-shield-halved" style="font-size: 36px; color: var(--primary); margin-bottom: 8px;"></i>
        <h2 style="font-size: 18px; font-weight: 800;">सुरक्षित एडमिन लॉगिन</h2>
        <p style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">वेबसाइट में बदलाव करने हेतु पासवर्ड दर्ज करें</p>
      </div>

      <div class="alert-msg alert-error" id="loginError">गलत पासवर्ड! कृपया सही पासवर्ड दर्ज करें।</div>

      <form id="loginForm" onsubmit="handleAdminLogin(event)">
        <div class="form-field">
          <label>एडमिन पासवर्ड</label>
          <input type="password" id="adminPasswordInput" required placeholder="पासवर्ड दर्ज करें">
        </div>
        <button type="submit" class="btn-admin">
          <i class="fa-solid fa-right-to-bracket"></i> लॉगिन करें
        </button>
      </form>
    </div>

    <!-- 2. Dashboard Panel (Visible after login) -->
    <div class="admin-panel-box" id="panelBox">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px;">
        <div>
          <h2 style="font-size: 17px; font-weight: 800;">वेबसाइट कंट्रोल पैनल</h2>
          <p style="font-size: 11px; color: var(--text-muted);">यहाँ जो भी बदलेंगे, वेबसाइट पर तुरंत अपडेट हो जाएगा</p>
        </div>
        <button class="btn-logout" onclick="handleAdminLogout()">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> लॉगआउट
        </button>
      </div>

      <div class="alert-msg alert-success" id="saveSuccess">बदलाव सफलतापूर्वक सेव हो गए हैं!</div>

      <form id="updateForm" onsubmit="saveWebsiteUpdates(event)">
        
        <!-- Live Ticker News -->
        <div class="form-field">
          <label><i class="fa-solid fa-bullhorn" style="color:#e11d48;"></i> मुख्य लाइव सूचना पट्टी (Ticker Text)</label>
          <textarea id="settingTicker" required placeholder="जैसे: बिहार SSC फॉर्म चालू • नया पैन कार्ड मात्र 3 दिन में"></textarea>
        </div>

        <!-- Store Timings -->
        <div class="form-field">
          <label><i class="fa-regular fa-clock" style="color:var(--primary);"></i> दुकान का समय / स्थिति</label>
          <input type="text" id="settingTiming" required placeholder="जैसे: सुबह 8:00 AM से रात 8:00 PM (सातों दिन)">
        </div>

        <!-- Store Open / Closed Manual Override -->
        <div class="form-field">
          <label><i class="fa-solid fa-store" style="color:var(--wa);"></i> दुकान की वर्तमान स्थिति (Status)</label>
          <select id="settingStatus">
            <option value="auto">ऑटोमैटिक (सुबह 8 से रात 8 खुली रहेगी)</option>
            <option value="open">हमेशा खुली दिखाएं (Open)</option>
            <option value="closed">आज बंद है (Closed)</option>
          </select>
        </div>

        <!-- NEW: Store UPI ID Control -->
        <div class="form-field">
          <label><i class="fa-solid fa-qrcode" style="color:var(--primary);"></i> दुकान की UPI ID (PhonePe/GPay)</label>
          <input type="text" id="settingUPI" placeholder="जैसे: 9546565270@ybl">
        </div>

        <button type="submit" class="btn-admin" style="background: var(--wa); margin-bottom: 16px;">
          <i class="fa-solid fa-floppy-disk"></i> वेबसाइट अपडेट करें
        </button>
      </form>

      <!-- Change Password Section -->
      <div style="border-top: 1px solid var(--border); padding-top: 16px; margin-top: 16px;">
        <h4 style="font-size: 13px; font-weight: 700; margin-bottom: 10px;">
          <i class="fa-solid fa-key" style="color: #ca8a04;"></i> पासवर्ड बदलें
        </h4>
        <div class="form-field">
          <input type="password" id="newAdminPassword" placeholder="नया पासवर्ड दर्ज करें">
        </div>
        <button type="button" class="btn-admin" style="background: var(--primary);" onclick="updateAdminPassword()">
          <i class="fa-solid fa-check"></i> नया पासवर्ड सेट करें
        </button>
      </div>

    </div>

  </main>

  <script>
    // Theme sync
    if (localStorage.getItem("roc_theme") === "dark") {
      document.body.classList.add("dark-mode");
    }

    // Master Default Password
    const DEFAULT_PASS = "Rahul@Online#811308";

    function getStoredPassword() {
      return localStorage.getItem("roc_admin_pass") || DEFAULT_PASS;
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      const enteredPass = document.getElementById("adminPasswordInput").value.trim();
      const actualPass = getStoredPassword();

      if (enteredPass === actualPass) {
        document.getElementById("authBox").style.display = "none";
        document.getElementById("panelBox").style.display = "block";
        loadCurrentSettings();
      } else {
        const err = document.getElementById("loginError");
        err.style.display = "block";
        setTimeout(() => { err.style.display = "none"; }, 3000);
      }
    }

    function handleAdminLogout() {
      document.getElementById("adminPasswordInput").value = "";
      document.getElementById("panelBox").style.display = "none";
      document.getElementById("authBox").style.display = "block";
    }

    function loadCurrentSettings() {
      const currentTicker = localStorage.getItem("roc_ticker") || 
        "📢 बिहार SSC / BPSC ऑनलाइन भर्ती फॉर्म प्रारंभ • आय, जाति, निवास प्रमाण पत्र • नया पैन कार्ड मात्र 3 दिन में • आधार बैंकिंग नकद निकासी (AEPS)";
      const currentTiming = localStorage.getItem("roc_timing") || 
        "सुबह 8:00 AM से रात 8:00 PM (सातों दिन)";
      const currentStatus = localStorage.getItem("roc_status") || "auto";
      const currentUPI = localStorage.getItem("roc_upi") || "9546565270@ybl";

      document.getElementById("settingTicker").value = currentTicker;
      document.getElementById("settingTiming").value = currentTiming;
      document.getElementById("settingStatus").value = currentStatus;
      document.getElementById("settingUPI").value = currentUPI;
    }

    function saveWebsiteUpdates(e) {
      e.preventDefault();
      const ticker = document.getElementById("settingTicker").value.trim();
      const timing = document.getElementById("settingTiming").value.trim();
      const status = document.getElementById("settingStatus").value;
      const upi = document.getElementById("settingUPI").value.trim();

      // Perfectly matching with index.html keys
      localStorage.setItem("roc_ticker", ticker);
      localStorage.setItem("roc_timing", timing);
      localStorage.setItem("roc_status", status);
      if (upi) localStorage.setItem("roc_upi", upi);

      const msg = document.getElementById("saveSuccess");
      msg.style.display = "block";
      setTimeout(() => { msg.style.display = "none"; }, 3000);
    }

    function updateAdminPassword() {
      const newPass = document.getElementById("newAdminPassword").value.trim();
      if (newPass.length < 6) {
        alert("पासवर्ड कम से कम 6 अक्षरों का होना चाहिए!");
        return;
      }
      localStorage.setItem("roc_admin_pass", newPass);
      alert("पासवर्ड सफलतापूर्वक बदल दिया गया है! नया पासवर्ड याद रखें: " + newPass);
      document.getElementById("newAdminPassword").value = "";
    }
  </script>
</body>
</html>
